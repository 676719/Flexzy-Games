<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexzy Games</title>
<link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT-gMAJwtUfAmX-J0Vk9HAdLAjgpEc0cuKdCSzyEh2I6A&s">

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

html, body{
    height:100%;
}

body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at top,
        #001a1f,
        #1b5669 60%,
        #050505);
    color:#e0e0e0;
    font-family:'Orbitron',sans-serif;
    text-align:center;
}

/* LOADING */
#loadingScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    background: radial-gradient(circle at top,#000,#182a74 60%,#000);
}

#loadingScreen::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:linear-gradient(45deg,#00ffcc22,#00aaff22,#ff00ff22);
    animation:moveBg 6s linear infinite;
}

@keyframes moveBg{
    0%{transform:translate(-25%,-25%) rotate(0deg);}
    100%{transform:translate(-25%,-25%) rotate(360deg);}
}

.logo{
    font-size:46px;
    letter-spacing:6px;
    color:#00fff0;
    text-shadow:0 0 10px #00fff0,0 0 25px #00ff88,0 0 35px #0088ff;
}

.loading-bar{
    width:75%;
    height:35px;
    margin-top:40px;
    background:#111;
    border:3px solid #00fff0;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 0 25px #00fff0;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00ff88,#00e5ff);
}

.subtitle{
    margin-top:20px;
    font-size:14px;
    color:#aaa;
}

/* MAIN */
h1{
    margin:30px 0;
    text-shadow:0 0 10px #888;
}

.sidebar{
    position:fixed;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:220px;
}

#searchGames,
.menu-btn{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    border:2px solid #666;
    background:#1a1a1a;
    color:#d9d9d9;
    box-shadow:0 0 12px #555;
    font-family:'Orbitron',sans-serif;
}

.menu-btn{
    cursor:pointer;
}

.games-grid{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    margin-left:260px;
    padding:20px;
}

.game-card{
    width:150px;
    height:150px;
    border:2px solid #666;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
}

.game-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-title{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,.75);
    color:#ddd;
}

#gameArea{
    display:none;
    padding:20px;
}

iframe{
    width:95%;
    height:700px;
    border:2px solid #666;
}

.play-btn{
    padding:12px 20px;
    background:#1a1a1a;
    color:#ddd;
    border:2px solid #666;
    box-shadow:0 0 12px #555;
    font-family:'Orbitron',sans-serif;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen">
    <h1 class="logo">FLEXZY GAMES</h1>
    <div class="loading-bar"><div class="progress"></div></div>
    <div class="subtitle">Loading...</div>
</div>

<!-- HOME -->
<div id="homeScreen">

<div class="sidebar">
    <input type="text" id="searchGames" placeholder="Buscar juego..." onkeyup="searchGames()">
    <button class="menu-btn" onclick="showCategory('game')">Juegos</button>
    <button class="menu-btn" onclick="showCategory('proxy')">Proxy</button>
</div>

<h1>Flexzy Games</h1>

<div class="games-grid">

<!-- PROXYS -->
<div class="game-card" data-category="proxy" onclick="loadGame('Proxyhack','https://676719.github.io/Proxyhack/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMO6g2UHi9xr_Fth2Xibij4znp9BkdUKT-EQ&s=80">
<div class="game-title">PROXYHACK</div>
</div>

<div class="game-card" data-category="proxy" onclick="loadGame('BlockAway','https://blockaway.net/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhPmDrx5R_NzKTs0H6tVlybms-68Kni6L8bGRmNMMYBA&s=80">
<div class="game-title">BLOCK AWAY</div>
</div>

<div class="game-card" data-category="proxy" onclick="loadGame('ProxySite','https://www.proxysite.com/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTefYGWUbc3kTtMfHfkngvkYV4hBxYrrFB56YpZGDA9ug&s=80">
<div class="game-title">PROXY SITE</div>
</div>

<div class="game-card" data-category="proxy" onclick="loadGame('Croxyproxy','https://www.croxyproxy.com/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVxepYYdLtoHUFLAAFHDdDTPWxBa7aYjgfOc2DNXZ0&s=80">
<div class="game-title">CROXYPROXY</div>
</div>

<!-- JUEGOS -->
<div class="game-card" data-category="game" onclick="loadGame('Slope','https://slopegame.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbkEhpMuX8FeOg_oipY-8bFO-WHOeKf-EKNw&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('Krunker','https://krunker.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuP1rjOK4v52JzwaO1glUgA03sTA9viyOoOw&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('Battledudes','https://battledudes.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUYn9BckeYwm_DS4a1w-o3MH4lsfjlRCwd6g&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('Paper.io 3D','https://paperio.site/3d/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkMru2PDO_cZcXdyuB15sADiOj1ZYHgWHGLQ&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('Rocket','https://rocketgoal.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFnNvoMuBTDqyXW9n6uN5pGvdLUUniTk7IJA&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('FNAF','https://fnaffree.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCET8SQgYmNnN8jAnf_5C8H_SPE_97PZf2z69fLM7B&s=80">
<div class="game-title"></div>
</div>

<div class="game-card" data-category="game" onclick="loadGame('1v1LOL','https://1v1-lol.gitlab.io/')">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKN6F4_x-ZFPLH0XLZ8-EbUYP97IQVBMaI-J-bwlotoA&s=80">
<div class="game-title"></div>
</div>

</div>
</div>

<!-- GAME AREA -->
<div id="gameArea">
<h2 id="gameTitle"></h2>
<iframe id="gameFrame"></iframe><br><br>

<button class="play-btn" onclick="backToGames()">← Volver</button>
<button class="play-btn" onclick="openFullScreen()">Pantalla completa</button>
</div>

<script>
function loadGame(title,url){
 document.getElementById('homeScreen').style.display='none';
 document.getElementById('gameArea').style.display='block';
 document.getElementById('gameTitle').textContent=title;
 document.getElementById('gameFrame').src=url;
}

function backToGames(){
 document.getElementById('gameArea').style.display='none';
 document.getElementById('homeScreen').style.display='block';
 document.getElementById('gameFrame').src='';
}

function searchGames(){
 const input=document.getElementById('searchGames').value.toLowerCase();
 document.querySelectorAll('.game-card').forEach(card=>{
   const title=card.querySelector('.game-title').textContent.toLowerCase();
   card.style.display=title.includes(input)?'block':'none';
 });
}

function showCategory(type){
 document.querySelectorAll('.game-card').forEach(card=>{
   card.style.display = (type === card.dataset.category) ? 'block' : 'none';
 });
}

/* ABOUT:BLANK FULLSCREEN */
function openFullScreen(){
 const url=document.getElementById('gameFrame').src;
 if(!url) return;

 const win=window.open('about:blank','_blank');

 win.document.write(`
 <html>
 <head>
 <title>Full Screen</title>
 <style>
 html,body{margin:0;height:100%;background:black;}
 iframe{width:100%;height:100%;border:none;}
 </style>
 </head>
 <body>
 <iframe src="${url}"></iframe>
 </body>
 </html>
 `);

 win.document.close();
}

/* SHOW ONLY GAMES ON START */
window.onload=function(){
 let progress=0;
 const bar=document.querySelector('.progress');

 const interval=setInterval(()=>{
   progress+=2;
   bar.style.width=progress+'%';

   if(progress>=100){
     clearInterval(interval);
     document.getElementById('loadingScreen').style.display='none';
     showCategory('game');
   }
 },50);
};
</script>

</body>
</html>
